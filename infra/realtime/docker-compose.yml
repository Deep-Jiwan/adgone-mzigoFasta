# Location plane: MQTT broker + bridge on one small VPS (docs/ARCHITECTURE.md §3, Q-26).
#   cp .env.example .env && cp emqx/auth-bootstrap.csv.example emqx/auth-bootstrap.csv   # then edit both
#   docker compose up -d
services:
  emqx:
    image: emqx/emqx:5.8.6
    restart: unless-stopped
    env_file: .env
    environment:
      EMQX_ETC_DIR: /opt/emqx/etc
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/auth-bootstrap.csv:/opt/emqx/etc/auth-bootstrap.csv:ro
      - emqx-data:/opt/emqx/data
    ports:
      - "1883:1883"     # MQTT (driver app). Put TLS (8883) in front before production.
      - "8083:8083"     # MQTT over WebSocket (shop/ops browsers). Serve as wss:// behind TLS.
      - "127.0.0.1:18083:18083"  # dashboard: local only, reach it through an SSH tunnel

  bridge:
    build:
      context: ../..
      dockerfile: services/bridge/Dockerfile
    restart: unless-stopped
    depends_on: [emqx]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MQTT_URL: mqtt://emqx:1883
      MQTT_USERNAME: bridge
      MQTT_PASSWORD: ${BRIDGE_MQTT_PASSWORD}
      MQTT_SHARE_GROUP: bridge
      PUBLIC_SNAPSHOT_INTERVAL_SECONDS: "300"

volumes:
  emqx-data:
