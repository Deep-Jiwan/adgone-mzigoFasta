## EMQX for MzigoFasta. See docs/ARCHITECTURE.md §4.
## Secrets are NOT in this file. They are set through EMQX environment overrides in
## docker-compose.yml: EMQX_NODE__COOKIE and EMQX_AUTHENTICATION__2__SECRET (the JWT secret).

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = mzigofasta
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## Who may connect
##  1. Service accounts (the bridge) from the built-in database, seeded from auth-bootstrap.csv.
##     Unknown usernames fall through to the next authenticator.
##  2. Apps (drivers, shops, ops) with the short-lived JWT the API issues: username = user id,
##     password = token. The token's `acl` claim says which topics they may use.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm { name = sha256, salt_position = suffix }
    bootstrap_file = "${EMQX_ETC_DIR}/auth-bootstrap.csv"
    bootstrap_type = plain
  },
  {
    mechanism = jwt
    from = password
    use_jwks = false
    algorithm = "hmac-based"
    secret = "set-by-EMQX_AUTHENTICATION__2__SECRET"
    secret_base64_encoded = false
    verify_claims { username = "${username}" }
  }
]

## What they may do: the JWT `acl` claim is checked first; anything it doesn't allow is denied.
## Service accounts are superusers and skip this.
authorization {
  no_match = deny
  deny_action = ignore
  cache { enable = true, max_size = 64, ttl = 1m }
  sources = []
}

mqtt {
  max_packet_size = 256KB
  retain_available = true
  shared_subscription = true
}
